<!DOCTYPE html>
<html>
<head>
    <title>Event Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <h2>Event System</h2>

    <div class="nav-links" id="navLinks">
        <a onclick="showSection('login')">Login</a>
        <a onclick="showSection('registerUser')">Register</a>
    </div>
</div>


<div id="login" class="card section">
    <h3>Login</h3>

    <select id="role">
        <option value="user">User</option>
        <option value="admin">Admin</option>
    </select>

    <input id="loginEmail" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
</div>


<div id="registerUser" class="card section">
    <h3>User Registration</h3>
    <input id="rname" placeholder="Name">
    <input id="remail" placeholder="Email">
    <input id="rpassword" type="password" placeholder="Password">
    <button onclick="registerUser()">Register</button>
</div>

<div class="container">

    <!-- EVENTS -->
    <div id="events" class="section">
        <h2>All Events</h2>
        <div id="eventList" class="grid"></div>
    </div>

    <!-- ADD EVENT -->
    <div id="addEvent" class="section">
    <div class="card">
        <h3>Add Event</h3>

        <input id="name" placeholder="Event Name">

        <textarea id="description" placeholder="Event Description"></textarea>

        <input id="date" type="date">

        <input id="location" placeholder="Location">

        <input id="fees" placeholder="Fees">

        <button onclick="addEvent()">Add Event</button>
    </div>
</div>

    <!-- REGISTER -->
    <div id="register" class="section">
        <div class="card">
            <h3>Register</h3>
            <input id="pname" placeholder="Name">
            <input id="pemail" placeholder="Email">
            <input id="mobile" placeholder="Mobile">
            <input id="eventId" placeholder="Event ID">
            <button onclick="register()">Register</button>
        </div>
    </div>

    <!-- MY EVENTS -->
    <div id="myEvents" class="section">
        <div class="card">
            <h3>My Events</h3>
            <div id="myEventList"></div>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
