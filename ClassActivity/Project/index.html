<!DOCTYPE html>
<html>
<head>
    <title>Font Style Changer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Font Style Changer</h2>

    <textarea id="textArea" placeholder="Type your text here..."></textarea>

    <div class="controls">
        <!-- Font Family -->
        <select id="fontFamily">
            <option value="Arial">Arial</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Courier New">Courier New</option>
            <option value="Verdana">Verdana</option>
        </select>

        <!-- Font Size -->
        <input type="number" id="fontSize" placeholder="Size (px)" min="10" max="100">

        <!-- Color -->
        <input type="color" id="colorPicker">

        <!-- Style Buttons -->
        <button id="boldBtn">Bold</button>
        <button id="italicBtn">Italic</button>
        <button id="resetBtn">Reset</button>
    </div>

    <h3>Preview:</h3>
    <p id="preview"></p>
</div>

<script src="script.js"></script>
</body>
</html>
